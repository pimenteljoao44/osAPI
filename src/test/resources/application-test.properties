# Configuracao do perfil "test" (usado por PaymentIntegrationTest).
# H2 em memoria + propriedades obrigatorias da aplicacao (contrato: .env.example).
# Sem o segredo JWT e o SMTP abaixo, o contexto nem sobe (TokenService e
# EmailService exigem essas propriedades) — era a causa das 8 falhas da
# suite de pagamentos.

spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

api.security.token.secret=segredo-exclusivo-de-teste
app.cors.allowed-origins=http://localhost:4200
spring.mail.host=localhost
spring.mail.port=2525
spring.mail.username=teste@localhost
spring.mail.password=

app.authorizationApi=https://run.mocky.io/v3/9b89b419-a2f7-4885-aa86-5ddcea24d520
