spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

# Propriedades obrigatorias da aplicacao (contrato em .env.example). Sem o
# segredo JWT, TokenService nem constroi o bean e o contexto inteiro falha
# ao subir — causa raiz original das falhas em cascata no PaymentIntegrationTest.
api.security.token.secret=segredo-exclusivo-de-teste
spring.mail.host=localhost
spring.mail.port=2525
spring.mail.username=teste@localhost
spring.mail.password=

app.authorizationApi=https://run.mocky.io/v3/9b89b419-a2f7-4885-aa86-5ddcea24d520
