# Perfil exclusivo de teste: banco H2 em memoria emulando PostgreSQL.
# Usado pelo teste de fumaca para subir o contexto Spring completo sem
# depender de infraestrutura externa.
# (O nome "h2" e proposital: nao colide com os perfis "dev" e "test" que
# possuem @Configuration proprias em src/main.)

spring.datasource.url=jdbc:h2:mem:marmoraria;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Cada execucao de teste cria o schema a partir das entidades e o descarta no fim.
spring.jpa.hibernate.ddl-auto=create-drop

# Propriedades obrigatorias da aplicacao (contrato em .env.example)
api.security.token.secret=segredo-exclusivo-de-teste
spring.mail.host=localhost
spring.mail.port=2525
spring.mail.username=teste@localhost
spring.mail.password=
