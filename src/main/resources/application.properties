# =============================================================================
# Configuracao base — carregada em TODOS os ambientes.
# O que varia por ambiente vive em application-{profile}.properties.
# Contrato de variaveis de ambiente: ver .env.example na raiz do projeto.
# =============================================================================

spring.application.name=osmarmoraria-api

# Sem SPRING_PROFILES_ACTIVE definido, assume "dev" — garante que um clone
# limpo rode sem configuracao manual (reprodutibilidade).
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

server.port=${SERVER_PORT:8080}
