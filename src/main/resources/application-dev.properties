# =============================================================================
# Perfil DEV — desenvolvimento local.
# Todos os valores tem default funcional: `docker compose up -d` + run = no ar.
# Qualquer um pode ser sobrescrito por variavel de ambiente.
# =============================================================================

# --- Banco de dados (PostgreSQL do docker-compose.yml) ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/marmoraria}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# Em dev o Hibernate evolui o schema automaticamente.
# (Em producao isso e proibido — ver application-prod.properties; o versionamento
# de schema com Flyway esta nas recomendacoes futuras do REFACTORING.md.)
spring.jpa.hibernate.ddl-auto=update

# --- Diagnostico de SQL (apenas dev: ajuda a enxergar N+1 e queries geradas) ---
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# --- Seguranca ---
# Segredo de assinatura do JWT. O default abaixo existe SOMENTE para conveniencia
# de desenvolvimento local; nunca deve ser usado fora desta maquina.
api.security.token.secret=${JWT_SECRET:segredo-dev-local-nao-usar-em-producao}

# --- E-mail (recuperacao de senha) ---
# Sem um SMTP real configurado, o envio falha em runtime, mas a aplicacao sobe.
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:dev@localhost}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
