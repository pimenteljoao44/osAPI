# =============================================================================
# Perfil PROD — producao.
# Politica: NENHUM default. Toda configuracao sensivel vem do ambiente.
# Variavel ausente => placeholder nao resolve => a aplicacao FALHA NO BOOT
# (fail fast: melhor quebrar no deploy do que vazar um default inseguro).
# =============================================================================

# --- Banco de dados ---
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Producao nunca altera schema automaticamente: apenas valida se entidades e
# tabelas estao coerentes.
spring.jpa.hibernate.ddl-auto=validate

spring.jpa.show-sql=false

# --- Seguranca ---
api.security.token.secret=${JWT_SECRET}

# Origens autorizadas (separadas por virgula). Sem default: definir no ambiente.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# --- E-mail ---
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
